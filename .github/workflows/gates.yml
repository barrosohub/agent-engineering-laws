name: gates
# Cost split: check-laws (~3.5s) runs on all three OSes every push/PR. Selftest (~2 min,
# 46 full-gate subjects) runs on Ubuntu only per push (same-repo pull_request skips this
# job by design — push already covers the head; fork PRs still run it). If branch
# protection ever requires the selftest check, a skipped job will block merges; keep that
# in mind before requiring it. The full three-OS selftest — including macOS /bin/bash 3.2 —
# is scheduled, so the bash 3.2 proof survives without billing macOS minutes on every push.
# Do not "simplify" this back into one matrix.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"
# Include event_name so a push to the default branch cannot cancel the weekly scheduled
# three-OS selftest — that run is the only bash 3.2 proof. Do not collapse the key back
# to ref-only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-laws:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            gate_bash: bash
          - os: macos-latest
            gate_bash: /bin/bash
          - os: windows-latest
            gate_bash: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GATE_BASH: ${{ matrix.gate_bash }}
    steps:
      - uses: actions/checkout@v7
      - name: Show macOS /bin/bash version
        if: runner.os == 'macOS'
        run: /bin/bash --version
      - name: check-laws
        run: |
          "$GATE_BASH" scripts/check-laws.sh
      - name: audit (advisory)
        continue-on-error: true
        run: |
          "$GATE_BASH" scripts/audit-corpus.sh

  selftest:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GATE_BASH: bash
    steps:
      - uses: actions/checkout@v7
      - name: selftest-gate
        run: |
          "$GATE_BASH" scripts/selftest-gate.sh

  selftest-scheduled:
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            gate_bash: bash
          - os: macos-latest
            gate_bash: /bin/bash
          - os: windows-latest
            gate_bash: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GATE_BASH: ${{ matrix.gate_bash }}
    steps:
      - uses: actions/checkout@v7
      - name: Show macOS /bin/bash version
        if: runner.os == 'macOS'
        run: /bin/bash --version
      - name: selftest-gate
        run: |
          "$GATE_BASH" scripts/selftest-gate.sh
